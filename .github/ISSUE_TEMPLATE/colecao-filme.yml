name: "🎞️ Adicionar filme a uma coleção"
description: Adicionar um filme dentro de uma coleção já existente
title: "[colecao-filme] novo filme em coleção"
labels: ["colecao-filme"]
body:
  - type: input
    id: colecao_id
    attributes:
      label: ID da coleção
      description: Veja o id em data.json, ou use o painel do site que já preenche isso pra você.
    validations:
      required: true
  - type: input
    id: titulo
    attributes:
      label: Título do filme
    validations:
      required: true
  - type: input
    id: diretor
    attributes:
      label: Diretor
  - type: input
    id: ano
    attributes:
      label: Ano
  - type: input
    id: poster
    attributes:
      label: URL do pôster (opcional)
  - type: textarea
    id: nota
    attributes:
      label: Nota sobre este filme
